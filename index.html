<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>eToro Mobile Monitor</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fa;margin:0;padding:28px;color:#1f2937}
    .card{max-width:520px;margin:9vh auto;background:#fff;border:1px solid #d9dee7;border-radius:12px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
    h2{margin:0 0 10px}p{color:#475467}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aeb7c4;border-radius:8px;font-size:17px}
    button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:#1f6feb;color:#fff;font-size:16px;cursor:pointer}
    #msg{margin-top:12px;font-size:14px;color:#667085}.err{color:#b42318!important}.ok{color:#067647!important}
  </style>
</head>
<body>
  <div class="card">
    <h2>eToro Mobile Monitor</h2>
    <p>輸入監控密碼後直接連線。</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="監控密碼" autofocus>
    <button id="go">進入監控</button>
    <div id="msg">等待驗證。</div>
  </div>
<script>

const PASSWORD_SHA256 = '510fe6a59d8bbd8a7508c56a997d56a07632df77fd934cb556d883c9cb8c3193';

const elPassword = document.getElementById('password');
const elMsg = document.getElementById('msg');
const btn = document.getElementById('go');

function setMsg(text, cls='') {
  elMsg.textContent = text;
  elMsg.className = cls;
}

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function enterMonitor() {
  btn.disabled = true;
  try {
    const value = elPassword.value;
    if (!value) {
      setMsg('請輸入監控密碼。','err');
      return;
    }

    setMsg('驗證中...');
    const inputHash = await sha256Hex(value);
    if (inputHash !== PASSWORD_SHA256) {
      setMsg('密碼錯誤。','err');
      elPassword.select();
      return;
    }

    setMsg('驗證通過，正在取得目前監控網址...','ok');
    const response = await fetch('./endpoint.json?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('endpoint HTTP ' + response.status);
    const endpoint = await response.json();

    if (endpoint.status !== 'online' || typeof endpoint.url !== 'string' || typeof endpoint.token !== 'string' || !endpoint.token) {
      throw new Error('監控服務目前離線或尚未發布 Token');
    }

    const target = new URL(endpoint.url);
    if (target.protocol !== 'https:' || !target.hostname.endsWith('.trycloudflare.com')) {
      throw new Error('監控網址格式不正確');
    }
    target.pathname = '/';
    target.search = '';
    target.hash = '';
    target.searchParams.set('token', endpoint.token);

    setMsg('連線中...','ok');
    window.location.replace(target.toString());
  } catch (err) {
    setMsg('無法連線：' + (err && err.message ? err.message : String(err)), 'err');
  } finally {
    btn.disabled = false;
  }
}

btn.addEventListener('click', enterMonitor);
elPassword.addEventListener('keydown', e => { if (e.key === 'Enter') enterMonitor(); });
</script>
</body>
</html>
